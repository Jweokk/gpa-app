// ─── Guided Mode ──────────────────────────
function startGuided() {
  document.getElementById('guidedStartBtn').style.display = 'none';
  state.guidedStudentIdx = null;
  state.guidedScoreValue = null;
  state.guidedScoreStep = false;
  listenGuidedName();
}

function listenGuidedName() {
  document.getElementById('guidedStepDisplay').textContent = '🎤 请说学生姓名';
  document.getElementById('guidedStepName').style.display = '';
  document.getElementById('guidedStepScore').style.display = 'none';
  document.getElementById('guidedNameResult').innerHTML = '';
  document.getElementById('guidedNameCands').innerHTML = '';
  // Stop any previous recognition
  if (state.recognizing) {
    try { state.recognition.stop(); } catch(e) {}
    state.recognizing = false;
  }
  state.recognition = initRecognition();
  if (!state.recognition) return;
  // Guided mode: non-continuous so onend fires after each utterance
  state.recognition.continuous = false;
  state.recognition.interimResults = false;
  state.accumulatedText = '';
  state.fullTranscript = '';
  // Override onresult for name detection - process immediately when final result arrives
  state.recognition.onresult = function(event) {
    var final = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) final += event.results[i][0].transcript;
    }
    if (final) {
      state.accumulatedText += final;
      // Process immediately - Chrome fires onresult before onend with continuous=false
      var name = state.accumulatedText.trim();
      if (name) {
        state.accumulatedText = '';
        processGuidedName(name);
      }
    }
  };
  // onend is backup - if onresult already processed, this is a no-op
  state.recognition.onend = function() {
    if (state.mode !== 'guided') return;
    // If we have text, process it. Otherwise keep listening.
    if (state.accumulatedText.trim()) {
      processGuidedName(state.accumulatedText);
      state.accumulatedText = '';
    } else {
      try { state.recognition.start(); } catch(e) {}
    }
  };
  state.recognizing = true;
  try { state.recognition.start(); } catch(e) { console.error(e); }
  document.getElementById('micStatus').textContent = '🎤 聆听中... 说学生姓名';
  document.getElementById('micStatus').className = 'mic-status listening';
}

function processGuidedName(text) {
  text = text.trim();
  if (!text) { listenGuidedName(); return; }
  var candidates = findBestMatches(text, state.students);
  if (!candidates || candidates.length === 0) {
    document.getElementById('guidedNameResult').innerHTML = '❌ 未匹配到学生';
    document.getElementById('guidedNameCands').innerHTML = '<button class="btn-secondary" onclick="listenGuidedName()">重试</button>';
    return;
  }
  var best = candidates[0];
  if (best.score >= 90) {
    // Auto-match
    state.guidedStudentIdx = best.idx;
    document.getElementById('guidedNameResult').innerHTML = '✅ ' + escapeHtml(best.name) + ' (' + methodLabel(best.method) + ')';
    document.getElementById('guidedStepDisplay').textContent = '已匹配: ' + best.name;
    // Auto-continue to score after short delay
    setTimeout(function() { listenGuidedScore(); }, 800);
  } else if (best.score >= 60) {
    // Show candidates
    document.getElementById('guidedNameResult').innerHTML = '🤔 请选择:';
    var candHtml = '';
    for (var i = 0; i < Math.min(3, candidates.length); i++) {
      candHtml += '<button onclick="selectGuidedName(' + candidates[i].idx + ')">' + escapeHtml(candidates[i].name) + ' (' + Math.round(candidates[i].score) + '%)</button>';
    }
    candHtml += '<button onclick="listenGuidedName()" style="color:var(--gray-400)">都不是</button>';
    document.getElementById('guidedNameCands').innerHTML = candHtml;
  } else {
    // Low confidence
    document.getElementById('guidedNameResult').innerHTML = '❌ 未找到准确匹配，请选择或重试:';
    var candHtml = '';
    var maxShow = Math.min(5, candidates.length);
    for (var i = 0; i < maxShow; i++) {
      candHtml += '<button onclick="selectGuidedName(' + candidates[i].idx + ')">' + escapeHtml(candidates[i].name) + '</button>';
    }
    candHtml += '<button onclick="listenGuidedName()" style="color:var(--gray-400)">🎤 重说</button>';
    document.getElementById('guidedNameCands').innerHTML = candHtml;
  }
}

function selectGuidedName(idx) {
  state.guidedStudentIdx = idx;
  var s = state.students[idx];
  document.getElementById('guidedNameResult').innerHTML = '✅ ' + escapeHtml(s ? s.name : '');
  document.getElementById('guidedNameCands').innerHTML = '';
  setTimeout(function() { listenGuidedScore(); }, 500);
}

function listenGuidedScore() {
  if (state.guidedStudentIdx === null) return;
  var s = state.students[state.guidedStudentIdx];
  if (!s) return;
  document.getElementById('guidedStepDisplay').textContent = '🎤 请说 ' + s.name + ' 的成绩';
  document.getElementById('guidedStepName').style.display = 'none';
  document.getElementById('guidedStepScore').style.display = '';
  document.getElementById('guidedCurrentStudent').textContent = '正在录入: ' + escapeHtml(s.name);
  document.getElementById('guidedScoreInput').value = '';
  document.getElementById('guidedTimerDisplay').textContent = '';
  state.guidedScoreValue = null;
  // Stop any previous recognition
  if (state.recognizing) {
    try { state.recognition.stop(); } catch(e) {}
    state.recognizing = false;
  }
  state.recognition = initRecognition();
  if (!state.recognition) return;
  // Guided mode: non-continuous so onend fires after each utterance
  state.recognition.continuous = false;
  state.recognition.interimResults = false;
  state.accumulatedText = '';
  state.fullTranscript = '';
  state.recognition.onresult = function(event) {
    var final = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) final += event.results[i][0].transcript;
    }
    if (final) {
      state.accumulatedText += final;
      var scoreText = state.accumulatedText.trim();
      if (scoreText) {
        state.accumulatedText = '';
        processGuidedScore(scoreText);
      }
    }
  };
  // onend is backup - if onresult already processed, this is a no-op
  state.recognition.onend = function() {
    if (state.mode !== 'guided') return;
    var txt = state.accumulatedText.trim();
    console.log('[Guided] score onend, text:', JSON.stringify(txt));
    if (txt) {
      processGuidedScore(txt);
      state.accumulatedText = '';
    } else {
      try { state.recognition.start(); } catch(e) {}
    }
  };
  state.recognizing = true;
  try { state.recognition.start(); } catch(e) {}
  document.getElementById('micStatus').textContent = '🎤 聆听中... 说成绩';
  document.getElementById('micStatus').className = 'mic-status listening';
}

function processGuidedScore(text) {
  text = text.trim();
  if (!text) return;
  // Parse Chinese/Arabic numbers: "八十五"→85, "92"→92
  var score = parseChineseNumber(text);
  if (isNaN(score)) { 
    showToast('未识别到数字，请重说', 'warning');
    return;
  }
  state.guidedScoreValue = score;
  document.getElementById('guidedTimerDisplay').textContent = '⏱ ' + score;
  var timeout = parseFloat(document.getElementById('guidedInterval').value || 3) * 1000;
  // Cancel previous timer
  if (state.guidedTimer) clearTimeout(state.guidedTimer);
  // Start countdown display
  var remaining = Math.round(timeout / 1000);
  document.getElementById('guidedStepDisplay').textContent = '✅ 成绩 ' + score + ' — 自动确认倒计时 ' + remaining + 's';
  var countdownInterval = setInterval(function() {
    remaining--;
    if (remaining > 0) {
      document.getElementById('guidedStepDisplay').textContent = '✅ 成绩 ' + score + ' — 自动确认倒计时 ' + remaining + 's';
    } else {
      clearInterval(countdownInterval);
    }
  }, 1000);
  state.guidedTimer = setTimeout(function() {
    clearInterval(countdownInterval);
    confirmGuidedScore();
  }, timeout);
}

function confirmGuidedScore() {
  if (state.guidedTimer) { clearTimeout(state.guidedTimer); state.guidedTimer = null; }
  if (state.guidedStudentIdx === null || state.guidedScoreValue === null) return;
  // Check if manual input has a value
  var manualVal = document.getElementById('guidedScoreInput').value.trim();
  if (manualVal) {
    var parsed = parseFloat(manualVal);
    if (!isNaN(parsed)) state.guidedScoreValue = parsed;
  }
  applyScore(state.guidedStudentIdx, state.guidedScoreValue);
  var s = state.students[state.guidedStudentIdx];
  // TTS announcement
  if (window.speechSynthesis && s) {
    var utter = new SpeechSynthesisUtterance(s.name + '，' + state.guidedScoreValue + '分');
    utter.lang = 'zh-CN';
    utter.rate = 1.0;
    window.speechSynthesis.speak(utter);
  }
  document.getElementById('guidedStepDisplay').textContent = '✅ 已录入 — ' + (s ? s.name : '') + ' = ' + state.guidedScoreValue;
  // Auto-advance to next ungraded student after short delay
  setTimeout(function() {
    // Reset for next student - always go back to name step
    // Allows re-recording over existing scores
    document.getElementById('guidedStepDisplay').textContent = '✅ 已录入 ' + (s ? s.name : '') + '，继续说下一个姓名';
    state.guidedStudentIdx = null;
    state.guidedScoreValue = null;
    document.getElementById('guidedStepName').style.display = '';
    document.getElementById('guidedStepScore').style.display = 'none';
    document.getElementById('guidedNameResult').innerHTML = '';
    document.getElementById('guidedNameCands').innerHTML = '';
    document.getElementById('guidedTimerDisplay').textContent = '';
    listenGuidedName();
  }, 1500);
}

function retryGuidedScore() {
  if (state.guidedTimer) { clearTimeout(state.guidedTimer); state.guidedTimer = null; }
  state.guidedScoreValue = null;
  document.getElementById('guidedScoreInput').value = '';
  document.getElementById('guidedTimerDisplay').textContent = '';
  listenGuidedScore();
}

// Keyboard shortcut: Space to toggle mic
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    document.getElementById('micBtn').click();
  }
});
