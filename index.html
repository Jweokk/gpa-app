<script>
// CDN fallback loader — tries multiple sources for China compatibility
(function() {
  const scripts = [
    { name: 'xlsx', urls: [
      'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',
      'https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.20.3/dist/xlsx.full.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.20.3/xlsx.full.min.js',
    ]},
    { name: 'pinyin-pro', urls: [
      'https://cdn.jsdelivr.net/npm/pinyin-pro@3.24.0/dist/index.umd.min.js',
      'https://unpkg.com/pinyin-pro@3.24.0/dist/index.umd.min.js',
    ]}
  ];
  function loadNext(scriptInfo, idx, resolve, reject) {
    if (idx >= scriptInfo.urls.length) {
      reject(new Error(scriptInfo.name + ' 加载失败，请检查网络'));
      return;
    }
    var s = document.createElement('script');
    s.src = scriptInfo.urls[idx];
    s.onload = resolve;
    s.onerror = function() { loadNext(scriptInfo, idx + 1, resolve, reject); };
    document.head.appendChild(s);
  }
  window._libsReady = Promise.all(scripts.map(function(si) {
    return new Promise(function(resolve, reject) { loadNext(si, 0, resolve, reject); });
  }));
})();
</script>
<style>

  --primary: #4f46e5;
  --primary-light: #818cf8;
  --primary-bg: #eef2ff;
  --success: #10b981;

}

<script>
// ============================================
// GPA - 语音成绩登记系统
// ============================================

// ─── State ──────────────────────────────────
const state = {
  students: [],        // [{idx, name, score: null|number, matched: false}]
  history: [],         // [{idx, prevScore}] for undo
  fileName: '',
  recognizing: false,
  recognition: null,
  speechTimeout: null,
  pendingTranscript: '',
  lastResult: null,    // {transcript, nameText, score, candidate, candidates}
  currentHighlight: null,
};

// ─── Levenshtein ────────────────────────────
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => new Uint8Array(n+1));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}

// ─── Pinyin Matching ────────────────────────
function getPinyin(text) {
  try {
    return pinyinPro.pinyin(text, { toneType: 'none', type: 'array' });
  } catch(e) {
    return text.split('').map(c => c);
  }
}

function pinyinSimilarity(a, b) {
  const pa = getPinyin(a).join('');
  const pb = getPinyin(b).join('');
  const dist = levenshtein(pa, pb);
  const maxLen = Math.max(pa.length, pb.length);
  return maxLen > 0 ? 1 - dist / maxLen : 1;
}

function charSimilarity(a, b) {
  const dist = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length);
  return maxLen > 0 ? 1 - dist / maxLen : 1;
}

// ─── Name Matching ─────────────────────────
function findBestMatches(spoken, students) {
  const pending = students.filter(s => s.score === null || s.score === undefined);
  if (pending.length === 0) return [];

  const results = [];

  for (const s of pending) {
    // 1. Exact match
    if (spoken === s.name) {
      results.push({ ...s, score: 100, method: 'exact' });
      continue;
    }

    // 2. Pinyin exact
    const spPinyin = getPinyin(spoken).join(' ');
    const namePinyin = getPinyin(s.name).join(' ');
    let sim = 0;
    let method = '';

    if (spPinyin === namePinyin) {
      sim = 96;
      method = 'pinyin-exact';
    } else {
      // 3. Pinyin fuzzy
      const psim = pinyinSimilarity(spoken, s.name);
      const csim = charSimilarity(spoken, s.name);
      sim = Math.max(psim, csim) * 95;
      method = psim >= csim ? 'pinyin-fuzzy' : 'char-fuzzy';
    }

    // Bonus: first character matches
    if (spoken.length > 0 && s.name.length > 0 && spoken[0] === s.name[0]) {
      sim = Math.min(100, sim + 5);
    }

    results.push({ ...s, score: Math.round(sim), method });
  }

  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 5);
}

// ─── Parse Voice Text ──────────────────────
function parseVoiceText(text) {
  // Extract last number (including decimals)
  const numMatch = text.match(/(\d+(?:\.\d+)?)\s*$|(\d+(?:\.\d+)?)\s*分\s*$/);
  if (!numMatch) return { nameText: text, score: null };

  let score;
  let nameText;
  if (numMatch[1] !== undefined) {
    score = parseFloat(numMatch[1]);
    nameText = text.substring(0, text.lastIndexOf(numMatch[1])).trim();
  } else if (numMatch[2] !== undefined) {
    score = parseFloat(numMatch[2]);
    const idx = text.lastIndexOf(numMatch[2]);
    nameText = text.substring(0, idx).trim();
  }

  // Clean up common fillers
  nameText = nameText.replace(/[，。、！？\s,\.\!\?\s]*$/g, '');

  return { nameText, score };
}

// ─── Toast ──────────────────────────────────
function showToast(msg, type = '') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

// ─── Excel IO ──────────────────────────────
function parseExcel(data, fileName) {
  let wb, ws, rows;
  try {
    wb = XLSX.read(data, { type: 'array' });
    ws = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
  } catch(e) {
    showToast('文件解析失败: 请确认文件为有效的 .xlsx 格式 (' + e.message + ')', 'error');
    console.error('XLSX.parse error:', e);
    return;
  }
  if (!rows || rows.length === 0) { showToast('Excel 文件为空', 'error'); return; }

  const headerRow = rows[0];
  let nameColIdx = 0;
  let scoreColIdx = -1;
  let hasHeader = false;

  // Guess if first row is a header or data
  if (headerRow && headerRow.length > 0) {
    for (let i = 0; i < headerRow.length; i++) {
      const h = String(headerRow[i] || '').trim();
      if (/姓名|名字|学生|name|score|成绩|分数|得分/i.test(h)) {
        hasHeader = true;
        if (/姓名|名字|学生|name/i.test(h) && !/score|成绩|分数|得分/i.test(h)) nameColIdx = i;
        if (/score|成绩|分数|得分/i.test(h)) scoreColIdx = i;
      }
    }
  }

  state.students = [];
  const startRow = hasHeader ? 1 : 0;

  for (let r = startRow; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const name = String(row[nameColIdx] || '').trim();
    if (!name) continue;
    const existingScore = (scoreColIdx >= 0 && row[scoreColIdx] !== undefined && row[scoreColIdx] !== '')
      ? parseFloat(row[scoreColIdx]) : null;
    state.students.push({
      idx: state.students.length,
      name,
      score: (existingScore !== null && !isNaN(existingScore)) ? existingScore : null,
      matched: existingScore !== null && !isNaN(existingScore),
    });
  }

  if (state.students.length === 0) {
    showToast('未找到学生数据，请确认第一列是学生姓名', 'error');
    return;
  }

  state.fileName = fileName;
  state.history = [];
  state.lastResult = null;

  showToast(`已加载 ${state.students.length} 名学生`, 'success');
  renderAll();
}

// ─── Render ─────────────────────────────────
function renderAll() {
  renderRoster();
  renderProgress();
  renderExport();
}

function renderRoster() {
  const tbody = document.getElementById('studentBody');
  const count = document.getElementById('rosterCount');
  let html = '';
  let done = 0;
  const highlight = state.currentHighlight;

  for (const s of state.students) {
    const isDone = s.score !== null && s.score !== undefined;
    if (isDone) done++;
    const rowClass = isDone ? 'done' : 'pending';
    const hlClass = highlight === s.idx ? ' current' : '';
    html += `<tr class="${rowClass}${hlClass}">
      <td>${s.idx + 1}</td>
      <td>${s.name}</td>
      <td class="score-cell ${isDone ? 'done' : ''}">${isDone ? s.score : '—'}</td>
      <td class="status-icon">${isDone ? '✅' : '⏳'}</td>
    </tr>`;
  }

  tbody.innerHTML = html;
  count.textContent = `${done}/${state.students.length}`;

  // Scroll to current highlight
  if (highlight !== null) {
    const rows = tbody.querySelectorAll('tr');
    if (rows[highlight]) rows[highlight].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function renderProgress() {
  const done = state.students.filter(s => s.score !== null && s.score !== undefined).length;
  const total = state.students.length;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = total > 0 ? `${(done/total)*100}%` : '0%';
}

function renderExport() {
  const done = state.students.filter(s => s.score !== null && s.score !== undefined).length;
  const total = state.students.length;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('downloadBtn').disabled = done === 0;
  document.getElementById('exportArea').style.display = total > 0 ? 'flex' : 'none';

  // Show undo
  document.getElementById('undoBtn').classList.toggle('hidden', state.history.length === 0);
}

function renderMatchResult(result) {
  const el = document.getElementById('matchResult');
  if (!result) { el.innerHTML = ''; return; }

  const { transcript, nameText, score, applied, candidates } = result;

  if (applied) {
    // Auto-matched
    el.innerHTML = `
      <div class="match-auto">
        <div>
          <div class="name">${applied.name}</div>
          <div class="method">${applied.method}</div>
        </div>
        <div class="score">${score}</div>
      </div>`;
    document.getElementById('lastMatchName').textContent = `✅ ${applied.name} = ${score}`;
  } else if (candidates && candidates.length > 0) {
    // Show candidates
    const total = candidates.length;
    const maxShow = Math.min(3, total);
    let btns = '';
    for (let i = 0; i < maxShow; i++) {
      const c = candidates[i];
      btns += `<button class="candidate-btn" onclick="applyCandidate(${c.idx}, ${score})">
        ${i+1}. ${c.name} <span class="confidence">${c.score}%</span>
      </button>`;
    }

    let manualInput = '';
    if (nameText) {
      manualInput = `
        <div class="manual-input-row">
          <input type="text" id="manualNameInput" value="${nameText}" placeholder="手动输入名字">
          <button onclick="applyManual(${score})">确认</button>
        </div>`;
    }

    el.innerHTML = `
      <div class="match-candidates">
        <div class="prompt">⚠️ 识别: "<strong>${nameText}</strong>"  成绩: <strong>${score}</strong>，请选择:</div>
        <div class="candidate-list">${btns}</div>
        ${manualInput}
      </div>`;
    document.getElementById('lastMatchName').textContent = `⚠️ ${nameText}?`;
  } else {
    // No candidates
    el.innerHTML = `
      <div class="match-candidates">
        <div class="prompt">❌ 未找到匹配 "${nameText}"</div>
        <div class="manual-input-row">
          <input type="text" id="manualNameInput" value="${nameText}" placeholder="手动输入名字">
          <input type="number" id="manualScoreInput" value="${score || ''}" placeholder="成绩" style="width:80px">
          <button onclick="applyManual(
            parseFloat(document.getElementById('manualScoreInput').value) || ${score || 0}
          )">确认</button>
        </div>
      </div>`;
    document.getElementById('lastMatchName').textContent = `❌ 未匹配`;
  }
}

// ─── Apply Match ───────────────────────────
function applyScore(studentIdx, score) {
  const s = state.students[studentIdx];
  if (!s) return;
  state.history.push({ idx: studentIdx, prevScore: s.score });
  s.score = score;
  s.matched = true;
  state.currentHighlight = null;
  state.lastResult = null;
  renderAll();
  document.getElementById('matchResult').innerHTML = '';
  showToast(`${s.name} = ${score} ✅`, 'success');
}

function applyCandidate(idx, score) {
  applyScore(idx, score);
  // Resume listening
  if (!state.recognizing) startRecognition();
}

function applyManual(score) {
  const nameInput = document.getElementById('manualNameInput');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) { showToast('请输入名字', 'warning'); return; }

  // Try exact match first, then fuzzy
  const matches = findBestMatches(name, state.students);
  if (matches.length > 0 && matches[0].score >= 85) {
    applyScore(matches[0].idx, score);
    return;
  }

  // Direct name match within students
  const direct = state.students.find(s => s.name === name);
  if (direct) {
    applyScore(direct.idx, score);
    return;
  }

  // Couldn't find, prompt
  showToast(`未找到学生 "${name}"`, 'error');
}

// Undo
document.getElementById('undoBtn').addEventListener('click', () => {
  if (state.history.length === 0) return;
  const last = state.history.pop();
  const s = state.students[last.idx];
  s.score = last.prevScore;
  s.matched = last.prevScore !== null;
  renderAll();
  showToast(`撤销 ${s.name}`, 'warning');
});

// ─── Speech Recognition ────────────────────
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('micStatus').textContent = '❌ 浏览器不支持语音识别，请使用 Chrome';
    document.getElementById('micBtn').disabled = true;
    return null;
  }
  const r = new SR();
  r.lang = 'zh-CN';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 3;

  let finalTranscript = '';
  let lastProcessedIndex = 0;

  r.onresult = (event) => {
    let interim = '';
    let final = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        final += result[0].transcript;
      } else {
        interim += result[0].transcript;
      }
    }

    // Show live transcript
    const box = document.getElementById('transcriptBox');
    if (interim) {
      box.innerHTML = `<span class="name-part">${escapeHtml(final)}</span> <span class="highlight">${escapeHtml(interim)}</span>`;
    } else if (final) {
      box.innerHTML = `<span class="name-part">${escapeHtml(final)}</span>`;
    }

    // Process on silence (debounce)
    if (final) {
      if (state.speechTimeout) clearTimeout(state.speechTimeout);
      state.speechTimeout = setTimeout(() => {
        processUtterance(final);
        final = '';
      }, 1200);
    }
  };

  r.onerror = (event) => {
    console.error('Speech error:', event.error);
    if (event.error === 'no-speech') return;
    showToast(`语音识别错误: ${event.error}`, 'error');
    stopRecognition();
  };

  r.onend = () => {
    if (state.recognizing) {
      // Auto-restart if we're supposed to be listening
      try { r.start(); } catch(e) {}
    }
  };

  return r;
}

function escapeHtml(text) {
  const el = document.createElement('span');
  el.textContent = text;
  return el.innerHTML;
}

function processUtterance(text) {
  text = text.trim();
  if (!text) return;

  const parsed = parseVoiceText(text);
  if (!parsed.score) {
    // Only name, no score yet - wait
    document.getElementById('transcriptBox').innerHTML =
      `已识别: <span class="name-part">${escapeHtml(parsed.nameText)}</span>，请说出成绩`;
    return;
  }

  // Find matches
  const candidates = findBestMatches(parsed.nameText, state.students);

  const result = {
    transcript: text,
    nameText: parsed.nameText,
    score: parsed.score,
    candidates: candidates,
    applied: null,
  };

  state.lastResult = result;

  if (candidates.length > 0 && candidates[0].score >= 90) {
    // Auto-apply
    const best = candidates[0];
    result.applied = { name: best.name, idx: best.idx, method: methodLabel(best.method) };
    applyScore(best.idx, parsed.score);
    state.currentHighlight = best.idx;
    document.getElementById('transcriptBox').innerHTML =
      `已识别: <span class="name-part">${escapeHtml(parsed.nameText)}</span> → ${escapeHtml(best.name)} <span class="score-part">${parsed.score}</span> ✅`;
    renderAll();
  } else {
    // Show candidates
    state.recognizing = false;
    if (state.recognition) {
      try { state.recognition.stop(); } catch(e) {}
    }
    document.getElementById('micBtn').className = 'mic-btn';
    document.getElementById('micStatus').textContent = '点击确认候选';
    document.getElementById('transcriptBox').innerHTML =
      `识别: <span class="name-part">${escapeHtml(parsed.nameText)}</span> <span class="score-part">${parsed.score}</span> — 请确认`;
    renderMatchResult(result);
    state.currentHighlight = candidates.length > 0 ? candidates[0].idx : null;
    renderAll();
  }
}

function methodLabel(m) {
  const labels = {
    'exact': '精确匹配',
    'pinyin-exact': '拼音匹配',
    'pinyin-fuzzy': '拼音近似',
    'char-fuzzy': '文字近似',
  };
  return labels[m] || m;
}

function startRecognition() {
  if (!state.recognition) {
    state.recognition = initRecognition();
    if (!state.recognition) return;
  }
  try { state.recognition.start(); } catch(e) { /* already running */ }
  state.recognizing = true;
  document.getElementById('micBtn').className = 'mic-btn listening';
  document.getElementById('micStatus').textContent = '🎤 聆听中... 说出学生姓名和成绩';
  document.getElementById('micStatus').className = 'mic-status listening';
  document.getElementById('transcriptBox').innerHTML = '<span class="text-sm" style="color:var(--gray-400)">等待语音输入...</span>';
}

function stopRecognition() {
  if (state.recognition) {
    try { state.recognition.stop(); } catch(e) {}
  }
  state.recognizing = false;
  document.getElementById('micBtn').className = 'mic-btn';
  document.getElementById('micStatus').textContent = '点击开始录入';
  document.getElementById('micStatus').className = 'mic-status';
  if (state.speechTimeout) { clearTimeout(state.speechTimeout); state.speechTimeout = null; }
}

// ─── Mic Button Toggle ─────────────────────
document.getElementById('micBtn').addEventListener('click', () => {
  // If we're showing candidates, clicking mic should instead handle that differently
  const resultEl = document.getElementById('matchResult');
  const hasCandidates = resultEl.querySelector('.match-candidates');

  if (state.recognizing) {
    stopRecognition();
  } else {
    // Clear previous match result if it's a candidate selection
    if (!hasCandidates) {
      document.getElementById('matchResult').innerHTML = '';
      state.lastResult = null;
    }
    startRecognition();
  }
});

// ─── File Upload ───────────────────────────
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.classList.add('dragover');
});
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

function handleFile(file) {
  if (!file.name.match(/\.xlsx?$/i)) {
    showToast('请上传 .xlsx 或 .xls 文件', 'error');
    return;
  }
  // Wait for libraries to load first
  Promise.resolve(window._libsReady || Promise.resolve())
    .then(function() {
      if (typeof XLSX === 'undefined' || typeof pinyinPro === 'undefined') {
        showToast('依赖库加载失败，请刷新页面重试', 'error');
        console.error('Lib check failed: XLSX=', typeof XLSX, 'pinyinPro=', typeof pinyinPro);
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          parseExcel(new Uint8Array(e.target.result), file.name);
          uploadZone.innerHTML = `
            <div class="icon">📄</div>
            <div><strong>${file.name}</strong> <span class="text-sm">(${file.size > 1024 ? Math.round(file.size/1024) + 'KB' : file.size + 'B'})</span></div>
            <button class="btn-secondary" onclick="resetUpload()">更换文件</button>
          `;
          uploadZone.className = 'upload-zone has-file';
          document.getElementById('mainApp').style.display = 'grid';
        } catch(err) {
          showToast('文件解析失败: ' + err.message, 'error');
          console.error('handleFile error:', err);
        }
      };
      reader.onerror = function() {
        showToast('文件读取失败', 'error');
      };
      reader.readAsArrayBuffer(file);
    })
    .catch(function(err) {
      showToast('依赖库加载失败: ' + err.message, 'error');
    });
}

function resetUpload() {
  state.students = [];
  state.history = [];
  state.lastResult = null;
  if (state.recognizing) stopRecognition();
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('exportArea').style.display = 'none';
  document.getElementById('matchResult').innerHTML = '';
  document.getElementById('transcriptBox').innerHTML = '<span class="text-sm" style="color:var(--gray-400)">识别结果将显示在这里...</span>';
  document.getElementById('lastMatchName').textContent = '';
  uploadZone.innerHTML = `
    <div class="icon">📁</div>
    <div><strong>上传 Excel 文件</strong></div>
    <p>拖拽或点击选择 .xlsx / .xls 文件<br>第一列应为学生姓名</p>
  `;
  uploadZone.className = 'upload-zone';
}

// ─── Download ──────────────────────────────
document.getElementById('downloadBtn').addEventListener('click', () => {
  // Re-create workbook with scores
  const data = state.students.map(s => ({
    '姓名': s.name,
    '成绩': s.score !== null ? s.score : '',
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '成绩');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const outName = state.fileName.replace(/\.(xlsx?)$/i, '_已填.$1');
  a.download = outName;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast(`已下载 ${outName}`, 'success');
});

// Keyboard shortcut: Space to toggle mic
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    document.getElementById('micBtn').click();
  }
});

// ─── Init ──────────────────────────────────
console.log('GPA · 语音成绩登记系统 已加载');
console.log('快捷键: Space 切换录音');
</script>
